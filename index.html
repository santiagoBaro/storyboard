<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Armemos la Historia! - Aventura en el Mapa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FAF5FF;
            background-image: radial-gradient(#F3E8FF 18%, transparent 19%), radial-gradient(#FCE7F3 18%, transparent 19%);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .disney-card {
            background: #FFFFFF;
            border-radius: 2rem;
            box-shadow: 0 20px 45px -10px rgba(147, 51, 234, 0.08), 0 0 0 1px rgba(244, 114, 182, 0.15);
        }

        .char-card {
            background: #FFFFFF;
            border-radius: 1.25rem;
            border-width: 3px;
            border-color: transparent;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .char-card.unselected {
            border-color: #f1f5f9;
            background-color: #f8fafc;
        }

        .char-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.06);
        }

        .map-viewport {
            width: 100%;
            height: 320px;
            overflow: hidden;
            border-radius: 1.5rem;
            position: relative;
            background-color: #6ee7b7;
            border: 5px solid white;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-stage-image {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 950px;
            max-width: none !important;
            height: auto;
            transform-origin: 0 0;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes kenburns {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12) translate(-1%, -1%);
            }

            100% {
                transform: scale(1);
            }
        }

        .video-player-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            border-radius: 1.25rem;
            position: relative;
            background-color: #020617;
            border: 4px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .video-scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: kenburns 14s infinite alternate ease-in-out;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 14px rgba(244, 63, 94, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
            }
        }

        .listening-indicator {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>

            useEffect(() => {

                const recognition = new SpeechRecognition();
                recognition.continuous = true;

                recognition.lang = 'es-ES';

                recognition.onresult = (event) => {
                    let spoken = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        spoken += event.results[i][0].transcript;
                    }
                    if (spoken.trim()) {
                        setTranscript(spoken.trim());
                        evalProgress(spoken.toLowerCase().trim());
                    }
                };

                recognition.onend = () => {

                };

                if (step === 'story' && difficulty !== 'narrada' && recognitionRef.current) {
                    try {
                        recognitionRef.current.start();

                } else if (recognitionRef.current && isListening) {
                    recognitionRef.current.stop();
                    setIsListening(false);
                }
            }, [step, currentStoryIndex, difficulty]);

                    let speakingRate = 1.0;

                    const charLower = (characterName || '').toLowerCase();
                    if (charLower.includes('minnie') || charLower.includes('daisy')) {
                        voiceName = "es-ES-Neural2-A";
                        pitch = 6.0;
                    } else if (charLower.includes('mickey')) {
                        voiceName = "es-ES-Neural2-B";
                        pitch = 4.0;
                    } else if (charLower.includes('donald')) {
                        voiceName = "es-ES-Neural2-B";
                        pitch = -4.0;
                        speakingRate = 1.1;
                    } else if (charLower.includes('perro') || charLower.includes('pluto') || charLower.includes('gato')) {
                        voiceName = "es-ES-Neural2-C";
                        pitch = 1.0;
                    }

                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text },
                            voice: { languageCode: "es-ES", name: voiceName },
                            audioConfig: { audioEncoding: "MP3", pitch, speakingRate }
                        })
                    });

                    if (!response.ok) throw new Error("TTS status " + response.status);

                    const data = await response.json();
                    const audio = new Audio("data:audio/mp3;base64," + data.audioContent);
                    if (window.currentAudio) window.currentAudio.pause();
                    window.currentAudio = audio;
                    audio.play();
                } catch (error) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-ES';
                    window.speechSynthesis.speak(utterance);
                }
            };

            useEffect(() => {
                if (step === 'story' && difficulty === 'narrada' && storyData) {
                    const currentLine = storyData.story[currentStoryIndex];
                    if (currentLine) {
                        if (window.currentAudio) window.currentAudio.pause();
                        window.speechSynthesis.cancel();

                        const textToRead = currentLine.type === 'action'
                            ? `¡Atención ${currentLine.player_name}! Mueve a ${currentLine.character}. ${currentLine.text}`
                            : currentLine.text;

                        playGoogleTTS(textToRead, currentLine.character);
                    }
                }
                return () => {
                    if (window.currentAudio) window.currentAudio.pause();
                    window.speechSynthesis.cancel();
                };
            }, [step, currentStoryIndex, difficulty, storyData]);

            // GENERACIÓN DE VIDEO FINAL CON LOADER
            const triggerEndingVideo = () => {
                setStep('generating_video');

                const promptQuery = encodeURIComponent(`Disney Pixar style 3D cartoon, Mickey Mouse Clubhouse celebration, happy children playing, magical glowing lights, storybook finish --width 800 --height 500`);
                const sceneUrl = `https://image.pollinations.ai/prompt/${promptQuery}?nologo=true`;

                const img = new Image();
                img.src = sceneUrl;
                img.onload = () => {
                    setVideoSceneUrl(sceneUrl);
                    setStep('video_playing');
                    playGoogleTTS(`¡Fin de la aventura! Recuerden siempre: ${storyData.moral}`, "Minnie");
                };
                img.onerror = () => {
                    setStep('finished');
                };
            };

            const evalProgress = (spoken) => {
                if (!storyData || step !== 'story') return;
                const currentLine = storyData.story[currentStoryIndex];

                if (currentLine.type === 'action') {
                    if (spoken.length > 2) advanceStory();
                } else {
                    const targets = currentLine.target_words || [];
                    const matches = targets.filter(w => spoken.includes(w.toLowerCase())).length;

                    if (difficulty === 'facil') {
                        if (spoken.length > 1) advanceStory();
                    } else if (difficulty === 'medio') {
                        if (matches >= Math.max(1, Math.floor(targets.length * 0.4)) || targets.length === 0) {
                            advanceStory();
                        }
                    } else if (difficulty === 'dificil') {
                        if (matches >= Math.max(1, Math.ceil(targets.length * 0.75)) || targets.length === 0) {
                            advanceStory();
                        }
                    }
                }
            };

            const advanceStory = () => {
                setTranscript('');
                if (window.currentAudio) window.currentAudio.pause();
                window.speechSynthesis.cancel();

                if (currentStoryIndex < storyData.story.length - 1) {
                    setCurrentStoryIndex(prev => prev + 1);
                } else {
                    triggerEndingVideo();
                }
            };

            const assignCharacter = (char) => {
                if (!activePlayerId) return;

                setSelectedCharacters(prev => {
                    const alreadyAssignedToMe = prev.find(sc => sc.char.id === char.id && sc.playerId === activePlayerId);
                    if (alreadyAssignedToMe) {
                        return prev.filter(sc => !(sc.char.id === char.id && sc.playerId === activePlayerId));
                    }
                    const withoutThisChar = prev.filter(sc => sc.char.id !== char.id);
                    return [...withoutThisChar, { char, playerId: activePlayerId }];
                });
            };

            const addPlayer = (isStar) => {
                const color = PLAYER_COLORS[players.length % PLAYER_COLORS.length];
                setPlayers(prev => [...prev, {
                    id: Date.now(),
                    name: isStar ? `Niño ${prev.length + 1}` : `Amigo ${prev.length + 1}`,
                    isStar,
                    color
                }]);
            };

            const removePlayer = (id) => {
                setPlayers(players.filter(p => p.id !== id));
                setSelectedCharacters(prev => prev.filter(sc => sc.playerId !== id));
            };

            const updatePlayerName = (id, newName) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const handlePlayersNext = () => {
                localStorage.setItem('gemini_story_players', JSON.stringify(players));
                if (players.length > 0 && !activePlayerId) {
                    setActivePlayerId(players[0].id);
                }
                setWizardStep(2);
            };

            const generateStory = async () => {
                const cleanKey = apiKey.trim();
                setStep('loading');

                const playersPrompt = players.map(p => {
                    const charsOfPlayer = selectedCharacters.filter(sc => sc.playerId === p.id).map(sc => sc.char.name);
                    return `- ${p.name} (Color: ${p.color}, Estrella: ${p.isStar ? 'SI' : 'NO'}) controla a: ${charsOfPlayer.length > 0 ? charsOfPlayer.join(', ') : 'Ninguno'}`;
                }).join('\n');

                const prompt = `
Crea un cuento interactivo corto para niños de 4 a 6 años enfocado en valores como la amabilidad, compartir, trabajar en equipo, superar obstaculos, hablar de sus emociones.
Que el final sea abierto para que el niño lo siga con su imaginacion.

Jugadores y sus personajes:
${playersPrompt}

UBICACIONES OBLIGATORIAS (Usa SOLO estos IDs):
${ZONES_PROMPT_LIST}

REGLAS:
1. Los Jugadores Estrella deben tener más intervenciones de lectura.
2. Intercala pasos de tipo "action" donde los muñecos deban desplazarse con sonidos divertidos.

Devuelve EXCLUSIVAMENTE un JSON válido sin bloques markdown:
{
  "title": "Aventura en el Club",
  "moral": "Compartir con amigos hace todo más alegre",
  "initial_positions": [
    { "character": "${selectedCharacters[0]?.char.name || 'Minnie'}", "locationId": "granja", "description": "en la granja roja" }
  ],
  "story": [
    {
      "type": "dialogue",
      "character": "${selectedCharacters[0]?.char.name || 'Minnie'}",
      "player_name": "${players[0]?.name || 'Jugador 1'}",
      "player_color": "${players[0]?.color || '#38BDF8'}",
      "text": "¡Hola a todos! Qué lindo día para explorar el mapa juntos.",
      "locationId": "granja",
      "target_words": ["hola", "lindo", "explorar"]
    }
  ]
}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${cleanKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

                    setStoryData(JSON.parse(rawText));
                    setCurrentPositionIndex(0);
                    setCurrentStoryIndex(0);
                    setStep('positioning');
                } catch (error) {
                    console.error("Error al generar historia:", error);
                    setErrorMessage("Por favor verifica tu Clave API de Gemini o tu conexión a Internet.");
                    setStep('error');
                }
            };


            /* ==============================================================
             * VISTAS SECUNDARIAS
             * ============================================================== */
            if (step === 'loading') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="text-7xl mb-4 animate-bounce">✨</div>
                        <h2 className="text-3xl font-extrabold text-slate-800">Creando la aventura mágica...</h2>
                        <p className="text-pink-500 font-bold mt-2">Repartiendo los turnos entre los jugadores estrella.</p>
                    </div>
                );
            }

            if (step === 'error') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6">
                        <div className="disney-card p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-4">⚠️</div>
                            <h2 className="text-2xl font-black text-rose-500 mb-2">No se pudo generar</h2>
                            <p className="text-xs bg-rose-50 text-rose-700 p-4 rounded-xl mb-6 text-left font-mono font-bold break-all">
                                {errorMessage}
                            </p>
                            <button onClick={() => setStep('setup')} className="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-lg transition">
                                Volver a Intentar
                            </button>
                        </div>
                    </div>
                );
            }

            // LOADER DEL VIDEO FINAL
            if (step === 'generating_video') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="w-16 h-16 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-6 mx-auto"></div>
                        <h2 className="text-3xl font-extrabold text-slate-800">Creando el video final mágico...</h2>
                        <p className="text-pink-500 font-bold mt-2">¡Pintando la moraleja de la historia!</p>
                    </div>
                );
            }

            // REPRODUCTOR DE VIDEO FINAL
            if (step === 'video_playing') {
                return (
                    <div className="min-h-screen flex flex-col p-4 sm:p-6 max-w-xl mx-auto justify-center">
                        <div className="disney-card p-6 sm:p-8 w-full flex flex-col items-center border border-pink-100 shadow-xl bg-slate-900 text-white">
                            <h1 className="text-2xl sm:text-3xl font-black text-white mb-5 text-center tracking-wide">
                                🎬 ¡Fin de la Aventura!
                            </h1>

                            <div className="video-player-container">
                                <img src={videoSceneUrl} alt="Escena del Video Final" className="video-scene-image" />
                                <div className="absolute top-3 left-3 bg-red-600 px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase text-white shadow">
                                    En Vivo
                                </div>
                            </div>

                            <div className="bg-white/10 rounded-2xl p-5 mt-6 w-full text-center border border-white/20">
                                <p className="text-xs font-black text-pink-300 uppercase tracking-widest mb-2">Enseñanza Mágica</p>
                                <p className="text-lg text-white font-bold italic">"{storyData?.moral}"</p>
                            </div>

                            <button onClick={() => { setStep('setup'); setWizardStep(1); }} className="w-full mt-6 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-extrabold py-4 rounded-2xl text-lg shadow-md transition active:scale-95">
                                Jugar de Nuevo 🔄
                            </button>
                        </div>
                    </div>
                );
            }

            // PASO DE COLOCAR LAS PIEZAS CON MAPA HARDCODEADO
            if (step === 'positioning' && storyData) {
                const pos = storyData.initial_positions[currentPositionIndex];
                const charObj = CHARACTERS.find(c => c.name.toLowerCase() === pos.character.toLowerCase()) || { name: pos.character, image: '', emoji: '🧸' };
                const zone = MAP_ZONES[pos.locationId] || { x: '50%', y: '50%', scale: 2.0, name: pos.description, detail: '' };

                return (
                    <div className="min-h-screen flex flex-col items-center p-6 max-w-xl mx-auto justify-center">
                        <div className="bg-white px-6 py-2 rounded-full font-extrabold text-pink-600 text-xs uppercase tracking-wider mb-4 shadow-sm border border-pink-100">
                            Preparando el mapa ({currentPositionIndex + 1} de {storyData.initial_positions.length})
                        </div>
                        <div className="disney-card p-6 w-full flex flex-col items-center border border-pink-100">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="w-14 h-14 bg-pink-50 rounded-2xl border-2 border-pink-200 p-1 flex items-center justify-center overflow-hidden shadow-sm">
                                    <img src={charObj.image} alt={charObj.name} className="w-full h-full object-contain" />
                                </div>
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-800">
                                    Coloca a <span className="text-pink-600">{pos.character}</span>
                                </h2>
                            </div>
                            <p className="text-slate-600 font-bold mb-4 text-center">
                                En: <span className="text-indigo-600 font-extrabold">{zone.name}</span> <span className="text-xs font-normal text-slate-400">({zone.detail})</span>
                            </p>

                            <div className="map-viewport mb-6">
                                <img
                                    src={MAP_IMAGE}
                                    alt="Mapa de Juego"
                                    className="map-stage-image"
                                    style={{ transform: `scale(${zone.scale}) translate(-${zone.x}, -${zone.y})` }}
                                />
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-rose-500 border-4 border-white shadow-xl flex items-center justify-center z-10">
                                    <div className="w-3 h-3 rounded-full bg-white animate-pulse"></div>
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    if (currentPositionIndex < storyData.initial_positions.length - 1) {
                                        setCurrentPositionIndex(prev => prev + 1);
                                    } else {
                                        setStep('story');
                                    }
                                }}
                                className="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-extrabold py-4 rounded-2xl text-lg shadow-md transition active:scale-95"
                            >
                                ¡Listo, ya lo coloqué! 👍
                            </button>
                        </div>
                    </div>
                );
            }

            // PANTALLA DE DIÁLOGO / ACCIÓN
            if (step === 'story' && storyData) {
                const current = storyData.story[currentStoryIndex];
                const isAction = current.type === 'action';
                const cardColor = isAction ? '#FEF08A' : (current.player_color || '#FFFFFF');
                const zone = MAP_ZONES[current.locationId] || { x: '50%', y: '50%', scale: 2.0 };
                const charObj = CHARACTERS.find(c => c.name.toLowerCase() === (current.character || '').toLowerCase());

                return (
                    <div className="min-h-screen flex flex-col p-4 sm:p-6 max-w-xl mx-auto justify-between">
                        <div className="flex justify-between items-center mb-3">
                            <span className="bg-white px-5 py-2 rounded-full font-black text-xs text-slate-700 shadow-sm border border-slate-100 truncate flex-1 mr-2">
                                {storyData.title}
                            </span>
                            <div className="flex items-center space-x-3 shrink-0">
                                {difficulty !== 'narrada' && (
                                    <span className={`w-3.5 h-3.5 rounded-full ${isListening ? 'bg-rose-500 animate-ping' : 'bg-slate-300'}`}></span>
                                )}
                                <button onClick={advanceStory} className="text-slate-500 hover:text-slate-800 text-xs font-black bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100">
                                    Avanzar ⏭
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 disney-card p-6 sm:p-8 flex flex-col justify-between overflow-hidden relative border border-white/60 shadow-lg" style={{ backgroundColor: cardColor }}>
                            <div className="flex justify-between items-start z-10">
                                <span className="bg-white/95 px-4 py-1.5 rounded-2xl text-xs sm:text-sm font-black text-slate-800 shadow-sm">
                                    Turno: {current.player_name}
                                </span>

                                <div className="w-16 h-16 rounded-2xl border-2 border-white shadow-md overflow-hidden bg-white relative flex items-center justify-center">
                                    <img src={MAP_IMAGE} alt="Zona" className="z-10"
                                        style={{ position: 'absolute', left: '50%', top: '50%', width: '320px', maxWidth: 'none', transformOrigin: '0 0', transform: `scale(${zone.scale * 0.7}) translate(-${zone.x}, -${zone.y})` }} />
                                </div>
                            </div>

                            <div className="my-auto text-center py-4 z-10 flex flex-col items-center">
                                {isAction ? (
                                    <div className="text-6xl mb-3">⚡</div>
                                ) : (
                                    <div className="flex items-center space-x-2 bg-white/80 px-4 py-1.5 rounded-full shadow-sm mb-3">
                                        {charObj && <img src={charObj.image} alt={charObj.name} className="w-7 h-7 object-contain" />}
                                        <span className="text-base font-extrabold text-slate-800">{current.character}</span>
                                    </div>
                                )}
                                <p className="text-2xl sm:text-3xl font-black text-slate-900 leading-snug">
                                    "{current.text}"
                                </p>
                            </div>

                            <div className="flex flex-col items-center z-10">
                                {difficulty === 'narrada' ? (
                                    <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-md text-2xl mb-2">
                                        🗣️
                                    </div>
                                ) : (
                                    <div className="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-md text-2xl listening-indicator mb-2">
                                        🎙️
                                    </div>
                                )}
                                <p className="text-xs sm:text-sm font-extrabold text-slate-700 bg-white/90 px-5 py-1.5 rounded-full shadow-sm">
                                    {difficulty === 'narrada'
                                        ? "Escuchando el cuento narrado..."
                                        : (isAction ? "¡Haz el sonido y mueve el muñeco!" : "Lee en voz alta para avanzar")}
                                </p>
                                {transcript && difficulty !== 'narrada' && (
                                    <p className="text-xs font-bold text-slate-600 mt-2 bg-white/80 px-4 py-1.5 rounded-xl max-w-full truncate shadow-sm">
                                        Escuchado: "{transcript}"
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'finished') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="disney-card p-10 max-w-md w-full bg-emerald-50/50 border border-emerald-100">
                            <div className="text-7xl mb-4">🌟</div>
                            <h1 className="text-4xl font-black text-emerald-800 mb-2">¡Fin del Cuento!</h1>
                            <div className="bg-white rounded-2xl p-5 my-6 shadow-sm border border-emerald-100">
                                <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Enseñanza Mágica</p>
                                <p className="text-base text-slate-800 font-bold italic">"{storyData?.moral}"</p>
                            </div>
                            <button onClick={() => { setStep('setup'); setWizardStep(1); }} className="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-extrabold py-4 rounded-2xl text-lg shadow-md transition active:scale-95">
                                Jugar de Nuevo
                            </button>
                        </div>
                    </div>
                );
            }


            /* ==============================================================
             * CONFIGURACIÓN INICIAL (WIZARD)
             * ============================================================== */
            return (
                <div className="min-h-screen p-4 sm:p-6 max-w-4xl mx-auto flex flex-col">
                    <header className="text-center mb-6 pt-2">
                        <div className="inline-flex items-center gap-1.5 bg-pink-100/80 px-4 py-1.5 rounded-full text-xs font-black text-pink-700 tracking-wider mb-2">
                            <span>✨</span>
                            <span>AVENTURA EN EL MAPA</span>
                            <span>✨</span>
                        </div>
                        <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                            ¡Armemos la Historia!
                        </h1>
                        {!isUrlKey && wizardStep > 0 && (
                            <button onClick={() => setWizardStep(0)} className="text-xs font-bold text-slate-400 underline mt-2 hover:text-slate-600">
                                Modificar Clave Mágica
                            </button>
                        )}
                    </header>

                    <main className="disney-card p-5 sm:p-8 border border-pink-100/70 flex-1">
                        <div className="flex justify-between items-center mb-8 px-2 max-w-md mx-auto">
                            {[1, 2, 3].map(st => (
                                <div key={st} className="flex items-center">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-sm border-2 ${wizardStep >= st ? 'bg-pink-500 text-white border-pink-500 shadow-md' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
                                        {st}
                                    </div>
                                    {st < 3 && (
                                        <div className={`w-12 sm:w-20 h-1 mx-2 rounded-full ${wizardStep > st ? 'bg-pink-300' : 'bg-slate-100'}`}></div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {/* PASO 0: API KEY */}
                        {wizardStep === 0 && (
                            <div className="max-w-md mx-auto animate-fadeIn">
                                <h3 className="text-xl font-black text-slate-800 text-center mb-2">Paso 0: Clave Mágica</h3>
                                <p className="text-sm font-medium text-slate-500 text-center mb-2">Ingresa tu llave de Gemini para jugar.</p>

                                <input
                                    type="password"
                                    placeholder="Pega tu clave AIzaSy..."
                                    className="bg-white border-2 border-amber-300 rounded-xl px-4 py-3 text-sm font-mono w-full focus:outline-none focus:ring-4 focus:ring-amber-200 mb-6 shadow-sm"
                                    value={apiKey}
                                    onChange={(e) => handleSaveKey(e.target.value)}
                                />
                                <button
                                    onClick={() => setWizardStep(1)}
                                    disabled={!apiKey.trim()}
                                    className={`w-full py-4 rounded-xl font-extrabold text-white shadow-md transition ${apiKey.trim() ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-slate-300 cursor-not-allowed'}`}
                                >
                                    Guardar y Continuar
                                </button>
                            </div>
                        )}

                        {/* PASO 1: JUGADORES */}
                        {wizardStep === 1 && (
                            <div className="animate-fadeIn max-w-xl mx-auto">
                                <h3 className="text-xl font-black text-slate-800 text-center mb-1">Paso 1: Jugadores</h3>
                                <p className="text-sm font-medium text-slate-500 text-center mb-6">¿Quiénes van a jugar hoy?</p>

                                <div className="space-y-3 mb-6">
                                    {players.map((p) => (
                                        <div key={p.id} className="flex items-center bg-white rounded-2xl px-5 py-3 border-2 border-slate-100 shadow-sm transition hover:border-slate-200">
                                            <span className="mr-3 text-xl">{p.isStar ? '⭐' : '👤'}</span>
                                            <input
                                                type="text"
                                                value={p.name}
                                                onChange={(e) => updatePlayerName(p.id, e.target.value)}
                                                className="bg-transparent font-bold text-slate-800 text-base flex-1 focus:outline-none"
                                                placeholder="Nombre del jugador..."
                                            />
                                            <div className="w-6 h-6 rounded-full shadow-inner mr-4 border-2 border-white" style={{ backgroundColor: p.color }}></div>
                                            <button onClick={() => removePlayer(p.id)} className="text-slate-300 hover:text-rose-500 font-black text-lg px-2">✕</button>
                                        </div>
                                    ))}
                                    {players.length === 0 && (
                                        <div className="bg-slate-50 text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center font-bold text-sm">
                                            No hay jugadores. ¡Agrega uno para empezar!
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                    <button onClick={() => addPlayer(true)} className="border-2 border-dashed border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-800 text-sm font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                                        <span>⭐</span> Agregar Niño Estrella
                                    </button>
                                    <button onClick={() => addPlayer(false)} className="border-2 border-dashed border-sky-300 bg-sky-50 hover:bg-sky-100 text-sky-800 text-sm font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                                        <span>👤</span> Agregar Amigo
                                    </button>
                                </div>

                                <button
                                    onClick={handlePlayersNext}
                                    disabled={players.length === 0}
                                    className={`w-full py-4 rounded-xl font-extrabold text-white text-lg shadow-md transition ${players.length > 0 ? 'bg-pink-500 hover:bg-pink-600' : 'bg-slate-300 cursor-not-allowed'}`}
                                >
                                    Siguiente: Elegir Personajes
                                </button>
                            </div>
                        )}

                        {/* PASO 2: ASIGNACIÓN DE PERSONAJES */}
                        {wizardStep === 2 && (
                            <div className="animate-fadeIn">
                                <h3 className="text-xl font-black text-slate-800 text-center mb-1">Paso 2: Asignar Personajes</h3>
                                <p className="text-sm font-medium text-slate-500 text-center mb-6">Toca el nombre del jugador y luego elige su personaje.</p>

                                <div className="flex flex-wrap gap-2 justify-center mb-6 bg-slate-50 p-2 rounded-2xl border border-slate-100">
                                    {players.map(p => (
                                        <button
                                            key={p.id}
                                            onClick={() => setActivePlayerId(p.id)}
                                            className={`px-4 py-2 rounded-xl font-black text-sm flex items-center gap-2 transition-all ${activePlayerId === p.id ? 'text-white shadow-md scale-105' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                            style={{ backgroundColor: activePlayerId === p.id ? p.color : undefined }}
                                        >
                                            <span>{p.isStar ? '⭐' : '👤'}</span> {p.name}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-4 mb-8">
                                    {CHARACTERS.map(c => {
                                        const assignedData = selectedCharacters.find(sc => sc.char.id === c.id);
                                        const ownerPlayer = assignedData ? players.find(p => p.id === assignedData.playerId) : null;

                                        return (
                                            <div
                                                key={c.id}
                                                onClick={() => assignCharacter(c)}
                                                className={`char-card p-3 cursor-pointer flex flex-col items-center justify-between text-center select-none ${!ownerPlayer ? 'unselected' : 'shadow-sm'}`}
                                                style={{ borderColor: ownerPlayer ? ownerPlayer.color : undefined }}
                                            >
                                                {ownerPlayer && (
                                                    <div className="absolute -top-2 -right-2 w-7 h-7 rounded-full text-white flex items-center justify-center text-xs font-black shadow-md border-2 border-white" style={{ backgroundColor: ownerPlayer.color }}>
                                                        ✓
                                                    </div>
                                                )}
                                                <div className="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center p-1 mb-2">
                                                    <img src={c.image} alt={c.name} className="w-full h-full object-contain filter drop-shadow-sm transition-transform duration-200 hover:scale-105" />
                                                </div>
                                                <div>
                                                    <h4 className="text-xs sm:text-sm font-extrabold text-slate-800 leading-tight">{c.name}</h4>
                                                    {ownerPlayer && (
                                                        <span className="inline-block px-2 py-0.5 rounded text-[10px] font-black text-white mt-1 shadow-sm truncate max-w-[80px]" style={{ backgroundColor: ownerPlayer.color }}>
                                                            {ownerPlayer.name}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setWizardStep(1)} className="px-6 py-4 rounded-xl font-extrabold text-slate-500 bg-slate-100 hover:bg-slate-200 transition">
                                        Atrás
                                    </button>
                                    <button
                                        onClick={() => setWizardStep(3)}
                                        disabled={selectedCharacters.length === 0}
                                        className={`flex-1 py-4 rounded-xl font-extrabold text-white text-lg shadow-md transition ${selectedCharacters.length > 0 ? 'bg-pink-500 hover:bg-pink-600' : 'bg-slate-300 cursor-not-allowed'}`}
                                    >
                                        Siguiente: Dificultad
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* PASO 3: DIFICULTAD Y INICIO */}
                        {wizardStep === 3 && (
                            <div className="animate-fadeIn max-w-2xl mx-auto">
                                <h3 className="text-xl font-black text-slate-800 text-center mb-1">Paso 3: Nivel de Lectura</h3>
                                <p className="text-sm font-medium text-slate-500 text-center mb-6">Selecciona el modo de juego y ¡a la aventura!</p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-8">
                                    {[
                                        { id: 'facil', icon: '🎂', title: '1) Fácil', desc: 'Sonidos y risas', tag: '3 a 4 años' },
                                        { id: 'medio', icon: '🧸', title: '2) Medio', desc: 'Palabras clave', tag: '5 años' },
                                        { id: 'dificil', icon: '🚀', title: '3) Difícil', desc: 'Leer frases largas', tag: '6+ años' },
                                        { id: 'narrada', icon: '🗣️', title: '4) Narrada', desc: 'El dispositivo lee', tag: 'Sin leer' }
                                    ].map(lvl => {
                                        const isSelected = difficulty === lvl.id;
                                        return (
                                            <div
                                                key={lvl.id}
                                                onClick={() => setDifficulty(lvl.id)}
                                                className={`p-4 rounded-2xl border-2 cursor-pointer transition select-none flex flex-col justify-between ${isSelected ? 'border-pink-500 bg-pink-50 shadow-sm' : 'border-slate-100 bg-slate-50 hover:bg-slate-100'}`}
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-lg">{lvl.icon}</span>
                                                    <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${isSelected ? 'border-pink-500' : 'border-slate-300'}`}>
                                                        {isSelected && <div className="w-2 h-2 rounded-full bg-pink-500"></div>}
                                                    </div>
                                                </div>
                                                <h4 className={`text-sm font-black mb-1 ${isSelected ? 'text-pink-700' : 'text-slate-800'}`}>{lvl.title}</h4>
                                                <p className="text-[11px] font-semibold text-slate-500 mb-2 leading-tight flex-1">{lvl.desc}</p>
                                                <span className={`inline-block text-[10px] font-extrabold px-2 py-0.5 rounded-md w-max ${isSelected ? 'bg-pink-100 text-pink-700' : 'bg-slate-200/70 text-slate-600'}`}>
                                                    {lvl.tag}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex gap-3">
                                    <button onClick={() => setWizardStep(2)} className="px-6 py-4 rounded-xl font-extrabold text-slate-500 bg-slate-100 hover:bg-slate-200 transition">
                                        Atrás
                                    </button>
                                    <button
                                        onClick={generateStory}
                                        className="flex-1 py-4 rounded-xl text-lg font-extrabold shadow-lg transition-all active:scale-95 bg-gradient-to-r from-rose-500 via-pink-500 to-rose-500 hover:from-rose-600 hover:to-pink-600 text-white flex items-center justify-center gap-2"
                                    >
                                        <span>✨</span> ¡Empezar Aventura!
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="text-center py-4 mt-2">
                        <p className="text-[11px] font-bold text-slate-400">
                            🌸 Inspirado en la magia de Minnie Mouse & Disney Junior
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
