<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Armemos la Historia! - Cómic Interactivo con IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FAF5FF;
            background-image: radial-gradient(#F3E8FF 18%, transparent 19%), radial-gradient(#FCE7F3 18%, transparent 19%);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            min-height: 100vh;
        }

        .font-comic {
            font-family: 'Bangers', cursive, sans-serif;
            letter-spacing: 0.05em;
        }

        .comic-bubble {
            position: relative;
            background: #FFFFFF;
            border: 3px solid #0f172a;
            border-radius: 1.5rem;
            box-shadow: 4px 4px 0px #0f172a;
        }

        .comic-bubble.bubble-event {
            background: #FEF3C7;
            border-color: #B45309;
            box-shadow: 4px 4px 0px #78350F;
        }

        .comic-bubble.bubble-action {
            background: #FEF08A;
            border-color: #CA8A04;
            box-shadow: 4px 4px 0px #854D0E;
        }

        .comic-bubble::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 14px 12px 0;
            border-style: solid;
            border-color: #FFFFFF transparent;
            display: block;
            width: 0;
        }

        .comic-bubble.bubble-event::after {
            border-color: #FEF3C7 transparent;
        }

        .comic-bubble.bubble-action::after {
            border-color: #FEF08A transparent;
        }

        .comic-bubble::before {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 17px 15px 0;
            border-style: solid;
            border-color: #0f172a transparent;
            display: block;
            width: 0;
        }

        .comic-panel {
            border: 3px solid #0f172a;
            box-shadow: 4px 4px 0px #0f172a;
            border-radius: 1rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .comic-panel.active {
            transform: scale(1.04);
            box-shadow: 6px 6px 0px #ec4899;
            border-color: #ec4899;
        }

        .char-card {
            background: #FFFFFF;
            border-radius: 1.25rem;
            border-width: 3px;
            border-color: transparent;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .char-card.unselected {
            border-color: #f1f5f9;
            background-color: #f8fafc;
        }

        .char-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.06);
        }

        .map-viewport {
            width: 100%;
            height: 320px;
            overflow: hidden;
            border-radius: 1.5rem;
            position: relative;
            background-color: #6ee7b7;
            border: 5px solid white;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-stage-image {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 950px;
            max-width: none !important;
            height: auto;
            transform-origin: 0 0;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        .video-player-container {
            width: 100%;
            height: 290px;
            overflow: hidden;
            border-radius: 1.5rem;
            position: relative;
            background-color: #020617;
            border: 4px solid #0f172a;
            box-shadow: 6px 6px 0px #0f172a;
        }

        .video-scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: kenburns 14s infinite alternate ease-in-out;
        }

        @keyframes kenburns {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08) translate(-1%, -1%);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes bounce-slow {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .animate-float {
            animation: bounce-slow 2.5s infinite ease-in-out;
        }
    </style>
</head>

<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { CHARACTERS, PLAYER_COLORS } from './personajes.js';
        import { MAP_IMAGE, MAP_ZONES } from './fondos.js';
        import { dialogAudio } from './dialogAudio.js';
        import { useSpeechRecognition, evaluateSpeechProgress, generateEventImage, generateEventVideo } from './events.js';
        import { generateStoryPrompt, continueStoryPrompt } from './story_prompts.js';

        const { useState, useEffect, useMemo, useCallback } = React;

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const keyFromUrl = urlParams.get('key') || urlParams.get('apikey');

            const [apiKey, setApiKey] = useState(() => keyFromUrl?.trim() || localStorage.getItem('gemini_story_key') || '');
            const [isUrlKey] = useState(!!keyFromUrl);

            const [wizardStep, setWizardStep] = useState(!apiKey ? 0 : 1);
            const [step, setStep] = useState('setup'); // 'setup' | 'loading_story' | 'generating_images' | 'positioning' | 'story' | 'generating_video' | 'video_playing' | 'error'

            const [players, setPlayers] = useState(() => JSON.parse(localStorage.getItem('gemini_story_players') || '[]'));
            const [selectedCharacters, setSelectedCharacters] = useState(() => JSON.parse(localStorage.getItem('gemini_story_selected_chars') || '[]'));
            const [activePlayerId, setActivePlayerId] = useState(null);
            const [difficulty, setDifficulty] = useState('facil');

            const [storyData, setStoryData] = useState(null);
            const [currentPositionIndex, setCurrentPositionIndex] = useState(0);
            const [activePanelIndex, setActivePanelIndex] = useState(0);
            const [chapterCount, setChapterCount] = useState(1);
            const [errorMessage, setErrorMessage] = useState('');

            // Galería de imágenes generadas por IA para TODAS las viñetas
            const [panelImages, setPanelImages] = useState({});
            const [imageGenProgress, setImageGenProgress] = useState({ current: 0, total: 0 });

            // Video final
            const [videoFinalUrl, setVideoFinalUrl] = useState('');
            const [isVideoOutput, setIsVideoOutput] = useState(false);

            useEffect(() => {
                if (apiKey) localStorage.setItem('gemini_story_key', apiKey.trim());
            }, [apiKey]);

            useEffect(() => {
                localStorage.setItem('gemini_story_players', JSON.stringify(players));
            }, [players]);

            useEffect(() => {
                localStorage.setItem('gemini_story_selected_chars', JSON.stringify(selectedCharacters));
            }, [selectedCharacters]);

            useEffect(() => {
                const playerIds = new Set(players.map(p => p.id));
                setSelectedCharacters(prev => prev.filter(sc => playerIds.has(sc.playerId)));
            }, [players]);

            const allPlayersHaveCharacter = useMemo(() => {
                return players.length > 0 && players.every(p => selectedCharacters.some(sc => sc.playerId === p.id));
            }, [players, selectedCharacters]);

            const panels = useMemo(() => {
                return storyData?.panels || storyData?.story || [];
            }, [storyData]);

            const initialPositions = useMemo(() => {
                if (storyData?.initial_positions?.length) {
                    return storyData.initial_positions;
                }
                return selectedCharacters.map((sc, idx) => ({
                    character: sc.char.name,
                    locationId: Object.keys(MAP_ZONES)[idx % Object.keys(MAP_ZONES).length],
                    description: 'en su posición'
                }));
            }, [storyData, selectedCharacters]);

            /**
             * Genera las imágenes de todas las viñetas en paralelo por lotes
             */
            const generateAllPanelImages = async (panelList) => {
                setStep('generating_images');
                setImageGenProgress({ current: 0, total: panelList.length });
                const imagesMap = {};
                const batchSize = 3;
                let completed = 0;

                for (let i = 0; i < panelList.length; i += batchSize) {
                    const batch = panelList.slice(i, i + batchSize);
                    await Promise.all(
                        batch.map(async (p, idxInBatch) => {
                            const realIndex = i + idxInBatch;
                            const zone = MAP_ZONES[p.locationId] || MAP_ZONES['minnie_living'];
                            const prompt = `Disney Pixar 3D animated comic panel, vibrant colorful lighting, high resolution 3D render. Scene location: ${zone.name} (${zone.detail}). Character: ${p.character}. Story event: ${p.text}.`;

                            try {
                                const imgUri = await generateEventImage(prompt, apiKey);
                                imagesMap[realIndex] = imgUri;
                            } catch (e) {
                                imagesMap[realIndex] = zone.sceneImage || MAP_IMAGE;
                            }
                            completed++;
                            setImageGenProgress({ current: completed, total: panelList.length });
                        })
                    );
                }

                setPanelImages(imagesMap);
            };

            // Control por voz
            const handleVoiceInput = useCallback((spoken) => {
                if (!panels.length || step !== 'story' || difficulty === 'narrada') return;
                const currentPanel = panels[activePanelIndex] || panels[0];
                if (evaluateSpeechProgress(spoken, currentPanel, difficulty)) {
                    advancePanel();
                }
            }, [panels, step, difficulty, activePanelIndex]);

            const { isListening, transcript, resetTranscript } = useSpeechRecognition({
                enabled: step === 'story' && difficulty !== 'narrada',
                onResult: handleVoiceInput
            });

            // Narración por voz en modo "narrada"
            useEffect(() => {
                if (step === 'story' && difficulty === 'narrada' && panels.length > 0) {
                    const currentPanel = panels[activePanelIndex] || panels[0];
                    if (currentPanel) {
                        let textToRead = currentPanel.text;
                        if (currentPanel.type === 'action') {
                            textToRead = `¡Atención ${currentPanel.player_name}! Desafío: ${currentPanel.text}`;
                        } else if (currentPanel.type === 'event') {
                            textToRead = `¡Atención todos! Suceso extraordinario: ${currentPanel.text}`;
                        }
                        dialogAudio.speak(textToRead, currentPanel.character, apiKey);
                    }
                }
                return () => dialogAudio.stop();
            }, [step, activePanelIndex, difficulty, panels, apiKey]);

            const advancePanel = () => {
                resetTranscript();
                dialogAudio.stop();
                if (activePanelIndex < panels.length - 1) {
                    setActivePanelIndex(prev => prev + 1);
                }
            };

            // Iniciar historia: Genera guión + genera todas las imágenes por adelantado
            const handleStartStory = async () => {
                setStep('loading_story');
                setErrorMessage('');
                try {
                    const data = await generateStoryPrompt({ players, selectedCharacters, apiKey });
                    setStoryData(data);
                    setCurrentPositionIndex(0);
                    setActivePanelIndex(0);
                    setChapterCount(1);

                    // Genera TODAS las imágenes antes de iniciar el juego
                    await generateAllPanelImages(data.panels);
                    setStep('positioning');
                } catch (err) {
                    console.error(err);
                    setErrorMessage(err.message || 'Error al conectar con Gemini.');
                    setStep('error');
                }
            };

            // Manejar elección final: Seguir historia infinitamente o Generar Video Final
            const handleSelectChoice = async (choice) => {
                dialogAudio.stop();

                if (choice.type === 'finish' || choice.id === '3') {
                    // Generar Video Final de la Historia con Gemini Omni Flash
                    setStep('generating_video');
                    const videoPrompt = `Disney Pixar 3D animated celebration video, Mickey Mouse Clubhouse friends celebrating happily together: ${storyData?.moral || 'compartir y divertirse'}. Confetti, warm volumetric lighting, high quality cinematic render, joyful story finish.`;

                    try {
                        const videoUri = await generateEventVideo(videoPrompt, apiKey);
                        if (videoUri) {
                            setVideoFinalUrl(videoUri);
                            setIsVideoOutput(true);
                        } else {
                            // Fallback con imagen panorámica animada
                            const imgUri = await generateEventImage(videoPrompt, apiKey);
                            setVideoFinalUrl(imgUri);
                            setIsVideoOutput(false);
                        }
                    } catch (vErr) {
                        console.warn('Error en video final, usando imagen:', vErr);
                        const imgUri = await generateEventImage(videoPrompt, apiKey);
                        setVideoFinalUrl(imgUri);
                        setIsVideoOutput(false);
                    }

                    setStep('video_playing');
                    dialogAudio.speak(`¡Fin de la aventura! Recuerden siempre: ${storyData?.moral || 'Trabajando juntos todo es más alegre'}`, 'Minnie', apiKey);
                    return;
                }

                // Si continúa, genera nuevo capítulo + nuevas imágenes para todas las viñetas
                setStep('loading_story');
                try {
                    const summary = panels.map(p => `[${p.type}] ${p.character}: ${p.text}`).join(' ');
                    const nextData = await continueStoryPrompt({
                        players,
                        selectedCharacters,
                        previousSummary: summary,
                        choiceText: choice.text,
                        apiKey
                    });

                    setStoryData(prev => ({
                        ...prev,
                        title: nextData.title || prev.title,
                        moral: nextData.moral || prev.moral,
                        panels: nextData.panels || [],
                        choices: nextData.choices || []
                    }));
                    setActivePanelIndex(0);
                    setChapterCount(c => c + 1);

                    await generateAllPanelImages(nextData.panels);
                    setStep('story');
                } catch (err) {
                    console.error(err);
                    setErrorMessage('No pudimos generar la continuación de la historia.');
                    setStep('error');
                }
            };

            const assignCharacter = (char) => {
                if (!activePlayerId) return;
                setSelectedCharacters(prev => {
                    const exists = prev.find(sc => sc.char.id === char.id && sc.playerId === activePlayerId);
                    if (exists) {
                        return prev.filter(sc => !(sc.char.id === char.id && sc.playerId === activePlayerId));
                    }
                    return [...prev.filter(sc => sc.char.id !== char.id), { char, playerId: activePlayerId }];
                });
            };

            const addPlayer = (isStar) => {
                const color = PLAYER_COLORS[players.length % PLAYER_COLORS.length];
                setPlayers(prev => [...prev, {
                    id: Date.now(),
                    name: isStar ? `Niño ${prev.length + 1}` : `Amigo ${prev.length + 1}`,
                    isStar,
                    color
                }]);
            };

            const removePlayer = (id) => {
                setPlayers(players.filter(p => p.id !== id));
            };

            const updatePlayerName = (id, newName) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            /* PANTALLAS DE CARGA */
            if (step === 'loading_story') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="text-7xl mb-4 animate-bounce">📚</div>
                        <h2 className="text-3xl font-black text-slate-800">Escribiendo la historia con Gemini 3.1...</h2>
                        <p className="text-pink-500 font-bold mt-2">Creando viñetas de diálogo, acción y eventos extraordinarios.</p>
                    </div>
                );
            }

            if (step === 'generating_images') {
                const pct = imageGenProgress.total > 0 ? Math.round((imageGenProgress.current / imageGenProgress.total) * 100) : 0;
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto">
                        <div className="text-7xl mb-4 animate-bounce">🎨</div>
                        <h2 className="text-2xl sm:text-3xl font-black text-slate-800 mb-2">Pintando todas las viñetas con IA...</h2>
                        <p className="text-slate-600 font-bold text-sm mb-6">
                            Ilustrando viñeta {imageGenProgress.current} de {imageGenProgress.total} con Gemini Nano Banana 2.1
                        </p>

                        <div className="w-full bg-slate-200 rounded-full h-5 p-1 border-2 border-slate-900 shadow-[3px_3px_0px_#0f172a] mb-3">
                            <div
                                className="bg-gradient-to-r from-pink-500 to-amber-400 h-full rounded-full transition-all duration-300"
                                style={{ width: `${pct}%` }}
                            />
                        </div>
                        <span className="font-comic text-xl text-slate-900">{pct}% completado</span>
                    </div>
                );
            }

            if (step === 'generating_video') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto">
                        <div className="w-16 h-16 border-4 border-slate-900 border-t-pink-500 rounded-full animate-spin mb-6 mx-auto" />
                        <h2 className="text-3xl font-black text-slate-800 mb-2">Creando el Video Final con IA...</h2>
                        <p className="text-pink-500 font-bold">Generando video de celebración con Gemini Omni 1.1 Flash 🎬</p>
                    </div>
                );
            }

            if (step === 'video_playing') {
                return (
                    <div className="min-h-screen flex flex-col p-4 sm:p-6 max-w-xl mx-auto justify-center select-none">
                        <div className="bg-white border-4 border-slate-900 rounded-[2.5rem] p-6 sm:p-8 w-full flex flex-col items-center shadow-[8px_8px_0px_#0f172a]">
                            <h1 className="text-3xl sm:text-4xl font-comic text-slate-900 mb-4 text-center">
                                🎬 ¡FIESTA FINAL DE LA AVENTURA!
                            </h1>

                            <div className="video-player-container w-full mb-4">
                                {isVideoOutput ? (
                                    <video src={videoFinalUrl} autoPlay loop controls playsInline className="w-full h-full object-cover" />
                                ) : (
                                    <img src={videoFinalUrl} alt="Escena Final con IA" className="video-scene-image" />
                                )}
                                <div className="absolute top-3 left-3 bg-red-600 border border-white px-3 py-0.5 rounded-full text-[10px] font-black tracking-widest uppercase text-white shadow">
                                    {isVideoOutput ? 'Video IA (Omni Flash)' : 'Ilustración Final IA'}
                                </div>
                            </div>

                            <div className="bg-amber-100 border-2 border-slate-900 rounded-2xl p-4 w-full text-center shadow-[3px_3px_0px_#0f172a] mb-5">
                                <p className="text-xs font-black text-amber-900 uppercase tracking-widest mb-1">Enseñanza Mágica</p>
                                <p className="text-base text-slate-900 font-bold italic">"{storyData?.moral}"</p>
                            </div>

                            <button
                                onClick={() => { setStep('setup'); setWizardStep(1); }}
                                className="w-full bg-pink-500 hover:bg-pink-600 text-white font-black py-4 rounded-2xl text-lg border-2 border-slate-900 shadow-[4px_4px_0px_#0f172a] transition active:scale-95"
                            >
                                Jugar una Nueva Aventura 🔄
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === 'error') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6">
                        <div className="bg-white border-4 border-slate-900 rounded-3xl p-8 max-w-md w-full text-center shadow-[8px_8px_0px_#0f172a]">
                            <div className="text-6xl mb-4">⚠️</div>
                            <h2 className="text-2xl font-black text-rose-500 mb-2">¡Algo ocurrió!</h2>
                            <p className="text-xs bg-rose-50 text-rose-700 p-4 rounded-xl mb-6 text-left font-mono font-bold break-all">
                                {errorMessage}
                            </p>
                            <button onClick={() => setStep('setup')} className="w-full bg-pink-500 hover:bg-pink-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-md border-2 border-slate-900 transition">
                                Volver a Intentar
                            </button>
                        </div>
                    </div>
                );
            }

            /* PREPARACIÓN DEL TABLERO */
            if (step === 'positioning' && storyData) {
                const pos = initialPositions[currentPositionIndex] || initialPositions[0];
                const charObj = CHARACTERS.find(c => c.name.toLowerCase() === (pos?.character || '').toLowerCase()) || { name: pos?.character || 'Personaje', image: '', emoji: '🧸' };
                const zone = MAP_ZONES[pos?.locationId] || { x: '50%', y: '50%', scale: 2.0, name: pos?.description || 'El Club', detail: '' };

                return (
                    <div className="min-h-screen flex flex-col items-center p-4 max-w-xl mx-auto justify-center">
                        <div className="bg-yellow-300 border-2 border-slate-900 px-6 py-1.5 rounded-full font-black text-xs uppercase tracking-wider mb-3 shadow-[3px_3px_0px_#0f172a]">
                            🗺️ Preparando el tablero ({currentPositionIndex + 1} de {initialPositions.length})
                        </div>

                        <div className="bg-white border-4 border-slate-900 rounded-[2rem] p-6 w-full flex flex-col items-center shadow-[8px_8px_0px_#0f172a]">
                            <div className="flex items-center space-x-3 mb-2">
                                <div className="w-16 h-16 bg-pink-50 rounded-2xl border-2 border-slate-900 p-1 flex items-center justify-center overflow-hidden">
                                    <img src={charObj.image} alt={charObj.name} className="w-full h-full object-contain" />
                                </div>
                                <div className="text-left">
                                    <h2 className="text-2xl font-black text-slate-900">
                                        Coloca a <span className="text-pink-600">{pos.character}</span>
                                    </h2>
                                    <p className="text-xs font-bold text-slate-500">¡Empieza en un lugar distinto para salir a buscarlo!</p>
                                </div>
                            </div>

                            <p className="text-slate-700 font-extrabold mb-4 text-center">
                                En: <span className="text-indigo-600 font-black">{zone.name}</span> <span className="text-xs text-slate-400">({zone.detail})</span>
                            </p>

                            <div className="map-viewport mb-6">
                                <img
                                    src={MAP_IMAGE}
                                    alt="Mapa de Juego"
                                    className="map-stage-image"
                                    style={{ transform: `scale(${zone.scale}) translate(-${zone.x}, -${zone.y})` }}
                                />
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-rose-500 border-4 border-white shadow-xl flex items-center justify-center z-10">
                                    <div className="w-3 h-3 rounded-full bg-white animate-pulse" />
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    if (currentPositionIndex < initialPositions.length - 1) {
                                        setCurrentPositionIndex(prev => prev + 1);
                                    } else {
                                        setActivePanelIndex(0);
                                        setStep('story');
                                    }
                                }}
                                className="w-full bg-emerald-400 hover:bg-emerald-500 border-3 border-slate-900 text-slate-900 font-black py-4 rounded-2xl text-lg shadow-[4px_4px_0px_#0f172a] transition active:translate-x-1 active:translate-y-1"
                            >
                                ¡Listo, ya lo coloqué! 👍
                            </button>
                        </div>
                    </div>
                );
            }

            /* PANTALLA PRINCIPAL: CÓMIC CON TODAS LAS ILUSTRACIONES IA YA LISTAS */
            if (step === 'story' && storyData && panels.length > 0) {
                const activePanel = panels[activePanelIndex] || panels[0];
                const isLastPanel = activePanelIndex === panels.length - 1;
                const activeZone = MAP_ZONES[activePanel.locationId] || MAP_ZONES['minnie_living'];
                const activeChar = CHARACTERS.find(c => c.name.toLowerCase() === (activePanel.character || '').toLowerCase());

                const isEvent = activePanel.type === 'event';
                const isAction = activePanel.type === 'action';
                const currentPanelAiImage = panelImages[activePanelIndex] || activeZone.sceneImage || MAP_IMAGE;

                return (

                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="text-center py-4 mt-2">
