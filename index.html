<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Armemos la Historia! - Aventura Multimedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FAF5FF;
            background-image: radial-gradient(#F3E8FF 18%, transparent 19%), radial-gradient(#FCE7F3 18%, transparent 19%);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .disney-card {
            background: #FFFFFF;
            border-radius: 2rem;
            box-shadow: 0 20px 45px -10px rgba(147, 51, 234, 0.08), 0 0 0 1px rgba(244, 114, 182, 0.15);
        }

        .char-card {
            background: #FFFFFF;
            border-radius: 1.25rem;
            border-width: 3px;
            border-color: transparent;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .char-card.unselected {
            border-color: #f1f5f9;
            background-color: #f8fafc;
        }

        .char-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.06);
        }

        .map-viewport {
            width: 100%;
            height: 320px;
            overflow: hidden;
            border-radius: 1.5rem;
            position: relative;
            background-color: #6ee7b7;
            border: 5px solid white;
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-stage-image {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 950px;
            max-width: none !important;
            height: auto;
            transform-origin: 0 0;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gentle-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .animate-bounce-gentle {
            animation: gentle-bounce 3.5s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 14px rgba(244, 63, 94, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
            }
        }

        .listening-indicator {
            animation: pulse-ring 2s infinite;
        }

        @keyframes blink-cursor {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: #EC4899;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink-cursor 0.8s infinite;
        }

        /* Estilos para Eventos Generados (Imagen/Video) */
        .generated-media-container {
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 4px solid rgba(255, 255, 255, 0.8);
            background: #000;
            position: relative;
        }

        @keyframes kenburns {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12) translate(-1%, -1%);
            }

            100% {
                transform: scale(1);
            }
        }

        .video-fx {
            animation: kenburns 12s infinite alternate ease-in-out;
        }
    </style>
</head>

<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MAP_IMAGE = './mapa.jpeg';

        const CHARACTERS = [
            { id: 'minnie', name: 'Minnie', subtitle: '¡Vestido de lunares!', emoji: '🎀', image: './personajes/minnie.png' },
            { id: 'mickey', name: 'Mickey', subtitle: '¡Líder de la casa!', emoji: '🐭', image: './personajes/mickey.png' },
            { id: 'donald', name: 'Donald', subtitle: '¡Gorra marinera!', emoji: '🦆', image: './personajes/donald.png' },
            { id: 'daisy', name: 'Daisy', subtitle: '¡Lazo morado coqueto!', emoji: '🌼', image: './personajes/daisy.png' },
            { id: 'pluto', name: 'Pluto', subtitle: '¡El fiel perrito!', emoji: '🐕', image: './personajes/pluto.png' },
            { id: 'gato', name: 'Gato (Figaro)', subtitle: '¡Travieso y mimoso!', emoji: '🐱', image: './personajes/gato.png' },
            { id: 'auto', name: 'Auto Rojo', subtitle: '¡Rumbo al paseo!', emoji: '🚗', image: './personajes/auto_rojo.png' },
            { id: 'dale', name: 'Ardillas', subtitle: '¡Grandes bellotas!', emoji: '🐿️', image: './personajes/ardilla.png' },
            { id: 'clarabella', name: 'Clarabella', subtitle: '¡La vaca amistosa!', emoji: '🐮', image: './personajes/clarabella.png' },
            { id: 'parro', name: 'Parro', subtitle: '¡El lorito hablador!', emoji: '🦜', image: './personajes/parro.png' }
        ];

        const PLAYER_COLORS = ['#38BDF8', '#34D399', '#F472B6', '#FBBF24', '#A78BFA'];

        const MAP_ZONES = {
            'granja': { name: 'La Granja', x: '14.6%', y: '22.3%', scale: 2.6, background: './fondos/Granja soleada con granero rojo.png' },
            'playa': { name: 'La Playa', x: '86.9%', y: '12.6%', scale: 2.6, background: './fondos/Playa dorada entre pinos.png' },
            'escenario': { name: 'El Escenario', x: '89.8%', y: '86.3%', scale: 2.6, background: './fondos/Escenario azul con plaza lavanda.png' },
            'plaza': { name: 'La Plaza', x: '8.3%', y: '84.8%', scale: 2.6, background: './fondos/Plaza ajardinada de lunares pastel.png' },
            'minnie_living': { name: 'Living de Minnie', x: '40.0%', y: '58.0%', scale: 3.1, background: './fondos/Salón curvo con rincón de lectura.png' },
            'minnie_cocina': { name: 'Cocina de Minnie', x: '52.7%', y: '34.2%', scale: 3.1, background: './fondos/Salón curvo con rincón de lectura.png' },
            'casa_perros': { name: 'Casa de Perros', x: '52.2%', y: '78.9%', scale: 3.0, background: './fondos/Casitas rojas y azules en el jardín.png' },
            'parque_juegos': { name: 'Parque de Juegos', x: '73.7%', y: '52.8%', scale: 2.8, background: './fondos/Parque infantil colorido sobre arena de juegos.png' },
            'casa_amarilla': { name: 'Casa Amarilla', x: '28.3%', y: '65.5%', scale: 3.0, background: './fondos/La casa amarilla de cúpula.png' },
            'bosque': { name: 'El Bosque', x: '84.0%', y: '34.2%', scale: 2.7, background: './fondos/Plaza ajardinada de lunares pastel.png' }
        };

        const ZONES_PROMPT_LIST = Object.entries(MAP_ZONES).map(([id, z]) => `- "${id}": ${z.name}`).join('\n');

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const keyFromUrl = urlParams.get('key') || urlParams.get('apikey');

            if (keyFromUrl) localStorage.setItem('gemini_story_key', keyFromUrl.trim());

            const initialKey = keyFromUrl ? keyFromUrl.trim() : (localStorage.getItem('gemini_story_key') || '');
            const [apiKey, setApiKey] = useState(initialKey);
            const [isUrlKey] = useState(!!keyFromUrl);

            const [wizardStep, setWizardStep] = useState(!initialKey ? 0 : 1);
            const [step, setStep] = useState('setup');
            const [videoSceneUrl, setVideoSceneUrl] = useState('');

            const savedPlayers = JSON.parse(localStorage.getItem('gemini_story_players') || '[]');
            const [players, setPlayers] = useState(savedPlayers);

            const savedSelectedCharacters = JSON.parse(localStorage.getItem('gemini_story_selected_chars') || '[]');
            const [selectedCharacters, setSelectedCharacters] = useState(savedSelectedCharacters);

            useEffect(() => { localStorage.setItem('gemini_story_selected_chars', JSON.stringify(selectedCharacters)); }, [selectedCharacters]);

            const [activePlayerId, setActivePlayerId] = useState(null);
            const [difficulty, setDifficulty] = useState('facil');

            const [storyData, setStoryData] = useState(null);
            const [currentPositionIndex, setCurrentPositionIndex] = useState(0);
            const [currentStoryIndex, setCurrentStoryIndex] = useState(0);
            const [errorMessage, setErrorMessage] = useState('');
            const [displayedText, setDisplayedText] = useState('');

            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const recognitionRef = useRef(null);

            const handleSaveKey = (val) => { setApiKey(val); localStorage.setItem('gemini_story_key', val.trim()); };

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;

                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'es-UY';

                recognition.onresult = (event) => {
                    let spoken = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) spoken += event.results[i][0].transcript;
                    if (spoken.trim()) { setTranscript(spoken.trim()); evalProgress(spoken.toLowerCase().trim()); }
                };
                recognition.onerror = () => setIsListening(false);
                recognition.onend = () => { if (isListening && step === 'story' && difficulty !== 'narrada') try { recognition.start(); } catch (e) { } };
                recognitionRef.current = recognition;
            }, [step, isListening, storyData, currentStoryIndex, difficulty]);

            useEffect(() => {
                if (step === 'story' && difficulty !== 'narrada' && recognitionRef.current) {
                    try { recognitionRef.current.start(); setIsListening(true); } catch (e) { }
                } else if (recognitionRef.current && isListening) {
                    recognitionRef.current.stop(); setIsListening(false);
                }
            }, [step, currentStoryIndex, difficulty]);

            const playGoogleTTS = async (textToSpeak, characterName, fullTextToDisplay) => {
                try {
                    let pitch = 0; let speakingRate = 1.0;
                    const charLower = (characterName || 'Minnie').toLowerCase();
                    if (charLower.includes('minnie') || charLower.includes('daisy') || charLower.includes('clarabella')) pitch = 6.0;
                    else if (charLower.includes('mickey')) pitch = 4.0;
                    else if (charLower.includes('donald')) { pitch = -4.0; speakingRate = 1.1; }
                    else if (charLower.includes('parro')) { pitch = 8.0; speakingRate = 1.2; }

                    const response = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            input: { text: textToSpeak },
                            voice: { languageCode: "es-UY" },
                            audioConfig: { audioEncoding: "MP3", pitch, speakingRate }
                        })
                    });

                    if (!response.ok) throw new Error("TTS status " + response.status);
                    const data = await response.json();
                    const audio = new Audio("data:audio/mp3;base64," + data.audioContent);
                    if (window.currentAudio) window.currentAudio.pause();
                    window.currentAudio = audio;

                    audio.ontimeupdate = () => {
                        if (audio.duration && !isNaN(audio.duration)) {
                            const ratio = Math.min(1, audio.currentTime / audio.duration);
                            setDisplayedText(fullTextToDisplay.slice(0, Math.ceil(fullTextToDisplay.length * ratio)));
                        }
                    };
                    audio.onended = () => setDisplayedText(fullTextToDisplay);
                    audio.play();
                } catch (error) {
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.lang = 'es-UY';
                    utterance.onboundary = (e) => { if (e.charIndex !== undefined) setDisplayedText(fullTextToDisplay.slice(0, e.charIndex + (e.charLength || 1))); };
                    utterance.onend = () => setDisplayedText(fullTextToDisplay);
                    window.speechSynthesis.speak(utterance);
                }
            };

            useEffect(() => {
                if (step === 'story' && storyData) {
                    const currentLine = storyData.story[currentStoryIndex];
                    if (!currentLine) return;

                    if (window.currentAudio) window.currentAudio.pause();
                    window.speechSynthesis.cancel();

                    if (difficulty === 'narrada') {
                        setDisplayedText('');
                        const textToRead = currentLine.text;
                        // Si es evento de imagen o video, usa un narrador neutro (Minnie por defecto si no hay character)
                        playGoogleTTS(textToRead, currentLine.character || 'Minnie', currentLine.text);
                    } else {
                        setDisplayedText(currentLine.text);
                    }
                }
                return () => { if (window.currentAudio) window.currentAudio.pause(); window.speechSynthesis.cancel(); };
            }, [step, currentStoryIndex, difficulty, storyData]);

            const evalProgress = (spoken) => {
                if (!storyData || step !== 'story') return;
                const currentLine = storyData.story[currentStoryIndex];

                // Si es un evento, requiere menos lectura precisa, con 2 palabras avanza
                if (currentLine.type !== 'dialogue') {
                    if (spoken.length > 2) advanceStory();
                } else {
                    const targets = currentLine.target_words || [];
                    const matches = targets.filter(w => spoken.includes(w.toLowerCase())).length;

                    if (difficulty === 'facil' && spoken.length > 1) advanceStory();
                    else if (difficulty === 'medio' && (matches >= Math.max(1, Math.floor(targets.length * 0.4)) || targets.length === 0)) advanceStory();
                    else if (difficulty === 'dificil' && (matches >= Math.max(1, Math.ceil(targets.length * 0.75)) || targets.length === 0)) advanceStory();
                }
            };

            const advanceStory = () => {
                setTranscript('');
                if (window.currentAudio) window.currentAudio.pause();
                window.speechSynthesis.cancel();

                if (currentStoryIndex < storyData.story.length - 1) setCurrentStoryIndex(prev => prev + 1);
                else {
                    setStep('generating_video');
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent("Disney Pixar style 3D cartoon, magical storybook finish")}?nologo=true`;
                    const img = new Image(); img.src = imgUrl;
                    img.onload = () => { setVideoSceneUrl(imgUrl); setStep('video_playing'); playGoogleTTS(`¡Fin de la aventura! Recuerden: ${storyData.moral}`, "Minnie", storyData.moral); };
                    img.onerror = () => setStep('finished');
                }
            };

            const assignCharacter = (char) => {
                if (!activePlayerId) return;
                setSelectedCharacters(prev => {
                    const exists = prev.find(sc => sc.char.id === char.id && sc.playerId === activePlayerId);
                    if (exists) return prev.filter(sc => !(sc.char.id === char.id && sc.playerId === activePlayerId));
                    return [...prev.filter(sc => sc.char.id !== char.id), { char, playerId: activePlayerId }];
                });
            };

            const addPlayer = (isStar) => {
                setPlayers(prev => [...prev, { id: Date.now(), name: isStar ? `Niño ${prev.length + 1}` : `Amigo ${prev.length + 1}`, isStar, color: PLAYER_COLORS[prev.length % PLAYER_COLORS.length] }]);
            };
            const removePlayer = (id) => { setPlayers(players.filter(p => p.id !== id)); setSelectedCharacters(prev => prev.filter(sc => sc.playerId !== id)); };
            const updatePlayerName = (id, newName) => setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            const handlePlayersNext = () => {
                localStorage.setItem('gemini_story_players', JSON.stringify(players));
                if (players.length > 0 && !activePlayerId) setActivePlayerId(players[0].id);
                setWizardStep(2);
            };

            const generateStory = async () => {
                const cleanKey = apiKey.trim();
                setStep('loading');

                const playersPrompt = players.map(p => {
                    const chars = selectedCharacters.filter(sc => sc.playerId === p.id).map(sc => sc.char.name);
                    return `- ${p.name} (Color: ${p.color}, Estrella: ${p.isStar ? 'SI' : 'NO'}) controla a: ${chars.length > 0 ? chars.join(', ') : 'Ninguno'}`;
                }).join('\n');

                const prompt = `
Crea un cuento interactivo corto para niños de 4 a 6 años enfocado en valores como amabilidad y trabajo en equipo.
Final abierto para imaginar.

Jugadores y personajes:
${playersPrompt}

UBICACIONES OBLIGATORIAS (Usa SOLO estos IDs):
${ZONES_PROMPT_LIST}

ESTRUCTURA DE LA HISTORIA:
La historia debe intercalar slides de tipo "dialogue", "image_event" y "video_event".
1. "dialogue": Interacción hablada. Requiere locationId, character (quién habla), player_name, player_color, text (lo que dice) y target_words.
2. "image_event": Un suceso especial estático. Requiere locationId, prompt (descripción hiper-detallada en INGLÉS para IA generativa, ej: "A shiny magic key glowing on the green grass, disney pixar 3d style"), y text (narración del evento en español).
3. "video_event": Una escena animada. Requiere locationId, characters_involved (array con nombres), prompt (descripción en INGLÉS para generador de video, ej: "Minnie and Mickey mouse dancing joyfully under sparkles, disney 3d animation"), y text (narración en español).

Devuelve EXCLUSIVAMENTE un JSON válido sin markdown:
{
  "title": "El Misterio del Parque",
  "moral": "Trabajar en equipo es muy divertido",
  "initial_positions": [ { "character": "Minnie", "locationId": "granja", "description": "en la granja" } ],
  "story": [
    {
      "type": "dialogue",
      "character": "Minnie",
      "player_name": "Jugador 1",
      "player_color": "#38BDF8",
      "text": "¡Hola! ¡Vamos a buscar pistas!",
      "locationId": "granja",
      "target_words": ["hola", "pistas"]
    },
    {
      "type": "image_event",
      "locationId": "bosque",
      "prompt": "A glowing magical blue butterfly resting on a tree branch, vibrant colors, disney 3d animation style",
      "text": "De repente, una mariposa mágica iluminó el camino."
    },
    {
      "type": "video_event",
      "locationId": "plaza",
      "characters_involved": ["Minnie", "Mickey"],
      "prompt": "Minnie and Mickey laughing and jumping together surrounded by floating bubbles, disney pixar 3d style",
      "text": "¡Todos celebraron saltando entre burbujas mágicas!"
    }
  ]
}`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${cleanKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.7 } })
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text.replace(/```json/gi, '').replace(/```/g, '').trim();
                    setStoryData(JSON.parse(rawText));
                    setCurrentPositionIndex(0); setCurrentStoryIndex(0); setStep('positioning');
                } catch (error) { setErrorMessage("Verifica tu Clave API o conexión."); setStep('error'); }
            };

            if (step === 'loading') return <div className="min-h-screen flex flex-col items-center justify-center"><div className="text-7xl mb-4 animate-bounce">✨</div><h2 className="text-3xl font-extrabold text-slate-800">Creando la aventura mágica...</h2></div>;
            if (step === 'error') return <div className="min-h-screen flex flex-col items-center justify-center p-6"><div className="disney-card p-8 text-center max-w-md w-full"><h2 className="text-2xl font-black text-rose-500 mb-2">Error</h2><p className="bg-rose-50 text-rose-700 p-4 rounded-xl mb-4 text-xs font-mono">{errorMessage}</p><button onClick={() => setStep('setup')} className="w-full bg-pink-500 text-white font-extrabold py-3 rounded-xl">Reintentar</button></div></div>;
            if (step === 'generating_video') return <div className="min-h-screen flex flex-col items-center justify-center"><div className="w-16 h-16 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-6"></div><h2 className="text-3xl font-extrabold text-slate-800">Preparando escena final...</h2></div>;

            if (step === 'video_playing' || step === 'finished') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="disney-card p-6 sm:p-8 w-full max-w-xl text-center bg-slate-900 text-white shadow-2xl">
                            <h1 className="text-3xl font-black mb-5">🎬 ¡Fin de la Aventura!</h1>
                            {step === 'video_playing' && (
                                <div className="generated-media-container h-64 mb-6">
                                    <img src={videoSceneUrl} className="w-full h-full object-cover video-fx" />
                                </div>
                            )}
                            <div className="bg-white/10 p-5 rounded-2xl border border-white/20">
                                <p className="text-xs text-pink-300 uppercase tracking-widest font-black mb-2">Enseñanza Mágica</p>
                                <p className="text-lg font-bold italic">"{storyData?.moral}"</p>
                            </div>
                            <button onClick={() => { setStep('setup'); setWizardStep(1); }} className="mt-6 w-full bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black py-4 rounded-xl">Jugar de Nuevo 🔄</button>
                        </div>
                    </div>
                );
            }

            if (step === 'positioning' && storyData) {
                const pos = storyData.initial_positions[currentPositionIndex];
                const charLower = (pos.character || '').toLowerCase();
                const charObj = CHARACTERS.find(c => c.name.toLowerCase() === charLower || c.id.toLowerCase() === charLower) || CHARACTERS[0];
                const zone = MAP_ZONES[pos.locationId] || { x: '50%', y: '50%', scale: 2.0, name: pos.description };
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 max-w-xl mx-auto">
                        <div className="disney-card p-6 w-full flex flex-col items-center border border-pink-100">
                            <div className="flex items-center space-x-3 mb-4"><img src={charObj.image} className="w-14 h-14 object-contain bg-pink-50 rounded-2xl p-1" /><h2 className="text-2xl font-black">Coloca a <span className="text-pink-600">{pos.character}</span></h2></div>
                            <p className="font-bold text-slate-600 mb-4">En: <span className="text-indigo-600 font-extrabold">{zone.name}</span></p>
                            <div className="map-viewport mb-6">
                                <img src={MAP_IMAGE} className="map-stage-image" style={{ transform: `scale(${zone.scale}) translate(-${zone.x}, -${zone.y})` }} />
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-rose-500 border-4 border-white flex items-center justify-center z-10"><div className="w-3 h-3 rounded-full bg-white animate-pulse"></div></div>
                            </div>
                            <button onClick={() => { if (currentPositionIndex < storyData.initial_positions.length - 1) setCurrentPositionIndex(prev => prev + 1); else setStep('story'); }} className="w-full bg-pink-500 text-white font-extrabold py-4 rounded-2xl">¡Colocado! 👍</button>
                        </div>
                    </div>
                );
            }

            // RENDER PRINCIPAL DE LA HISTORIA (DIALOGUE, IMAGE_EVENT, VIDEO_EVENT)
            if (step === 'story' && storyData) {
                const current = storyData.story[currentStoryIndex];
                const currentZone = MAP_ZONES[current.locationId] || { name: 'Aventura', background: MAP_IMAGE };
                const isMediaEvent = current.type === 'image_event' || current.type === 'video_event';
                const isStillSpeaking = difficulty === 'narrada' && displayedText.length < current.text.length;

                // URL de la imagen generada por IA (si es evento)
                const generatedImageUrl = isMediaEvent ? `https://image.pollinations.ai/prompt/${encodeURIComponent(current.prompt)}?nologo=true` : '';

                // Objeto Personaje (si es diálogo)
                let charObj = CHARACTERS[0];
                if (!isMediaEvent) {
                    const charLower = (current.character || '').toLowerCase();
                    charObj = CHARACTERS.find(c => c.name.toLowerCase() === charLower || charLower.includes(c.id)) || CHARACTERS[0];
                }

                return (
                    <div className="min-h-screen flex flex-col p-2 sm:p-5 max-w-4xl mx-auto justify-center">
                        <div
                            className="w-full relative rounded-3xl overflow-hidden shadow-2xl border-4 border-white flex flex-col min-h-[600px] sm:min-h-[660px] bg-slate-900 bg-cover bg-center"
                            style={{ backgroundImage: `url("${encodeURI(currentZone.background)}")` }}
                        >
                            <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60 pointer-events-none z-0"></div>

                            {/* Nav Header */}
                            <div className="relative z-20 p-3 sm:p-5 flex justify-between items-center gap-2">
                                <div className="bg-white/90 backdrop-blur-md px-4 py-1.5 rounded-full font-black text-xs text-slate-800 shadow-md flex items-center gap-2 border border-white">
                                    <span>📍</span><span>{currentZone.name}</span>
                                    <span className="text-slate-300">|</span>
                                    <span className="text-pink-600 truncate max-w-[120px] sm:max-w-none">{storyData.title}</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    {difficulty !== 'narrada' && <span className={`w-3.5 h-3.5 rounded-full border-2 border-white ${isListening ? 'bg-rose-500 animate-ping' : 'bg-slate-300'}`}></span>}
                                    <button onClick={advanceStory} className="text-slate-800 hover:text-pink-600 text-xs font-black bg-white/95 px-4 py-2 rounded-full shadow-lg border border-white">Avanzar ⏭</button>
                                </div>
                            </div>

                            {/* CONTENIDO CENTRAL (DIÁLOGO O EVENTO) */}
                            {isMediaEvent ? (
                                /* VISTA DE EVENTOS (IMAGEN / VIDEO) */
                                <div className="relative z-20 flex-1 flex flex-col items-center justify-center p-4">

                                    {/* Etiqueta del tipo de evento */}
                                    <div className="mb-4 bg-indigo-600 text-white font-black text-xs px-4 py-1.5 rounded-full shadow-lg border border-white/40 flex items-center gap-2 tracking-widest uppercase">
                                        {current.type === 'video_event' ? (
                                            <><span className="text-red-300 animate-pulse">●</span> CINTA DE VIDEO</>
                                        ) : (
                                            <>📸 FOTOGRAFÍA MÁGICA</>
                                        )}
                                    </div>

                                    {/* Contenedor del Media */}
                                    <div className="generated-media-container w-full max-w-2xl aspect-video bg-slate-800 mb-6 flex items-center justify-center">
                                        {/* Fallback loader mientras carga */}
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div className="w-10 h-10 border-4 border-indigo-400 border-t-white rounded-full animate-spin"></div>
                                        </div>
                                        {/* Imagen Generada por IA */}
                                        <img
                                            src={generatedImageUrl}
                                            className={`relative z-10 w-full h-full object-cover ${current.type === 'video_event' ? 'video-fx' : ''}`}
                                            alt="Evento Mágico"
                                            key={generatedImageUrl}
                                        />
                                        {/* Overlay para estilo de video */}
                                        {current.type === 'video_event' && (
                                            <div className="absolute inset-0 z-20 pointer-events-none shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] flex items-center justify-center">
                                                <div className="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/30">
                                                    <div className="w-0 h-0 border-l-[20px] border-l-white border-y-[12px] border-y-transparent ml-2"></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Caja de narración inferior */}
                                    <div className="bg-white/95 backdrop-blur-md rounded-2xl p-5 shadow-2xl border-2 border-indigo-200 max-w-xl w-full text-center">
                                        <p className="text-xl sm:text-2xl font-black text-slate-800 leading-snug">
                                            "{displayedText}{isStillSpeaking && <span className="typing-cursor bg-indigo-500"></span>}"
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                /* VISTA DE DIÁLOGO CLÁSICA */
                                <div className="relative z-20 flex-1 flex flex-col justify-between pt-2">
                                    <div className="w-full max-w-md sm:max-w-lg mx-auto px-4">
                                        <div className="relative rounded-3xl p-5 shadow-xl border-4 backdrop-blur-md bg-white/95 border-pink-300">
                                            <div className="flex justify-between items-center mb-3 pb-2 border-b border-pink-100">
                                                <span className="text-[11px] sm:text-xs font-black text-white px-3 py-1 rounded-full" style={{ backgroundColor: current.player_color }}>⭐ Turno: {current.player_name}</span>
                                                <span className="text-[11px] sm:text-xs font-black text-pink-600 bg-pink-50 px-3 py-1 rounded-full border border-pink-200">{charObj.name}</span>
                                            </div>
                                            <p className="text-xl sm:text-2xl font-black text-slate-800 leading-snug">"{displayedText}{isStillSpeaking && <span className="typing-cursor"></span>}"</p>
                                            <div className="absolute -bottom-4 left-12 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[16px] border-t-pink-300"></div>
                                            <div className="absolute -bottom-3 left-[50px] w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[14px] border-t-white"></div>
                                        </div>
                                    </div>

                                    <div className="flex items-end justify-between px-6 sm:px-12 pb-4">
                                        <div className="relative group">
                                            <img src={charObj.image} className="h-64 sm:h-80 object-contain filter drop-shadow-[0_15px_20px_rgba(0,0,0,0.6)] animate-bounce-gentle select-none" />
                                            <span className="block text-center mt-2 text-xs font-extrabold text-white bg-slate-900/60 px-3 py-1 rounded-full border border-white/20">{charObj.name}</span>
                                        </div>
                                        <div className="flex flex-col items-center w-40 text-center mb-4">
                                            <div className="w-14 h-14 bg-white/90 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg text-2xl mb-2 border border-white">
                                                {difficulty === 'narrada' ? '🗣️' : <span className="listening-indicator">🎙️</span>}
                                            </div>
                                            <p className="text-[11px] sm:text-xs font-black text-slate-800 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full shadow-lg border border-white">
                                                {difficulty === 'narrada' ? "Escuchando..." : "Lee para avanzar"}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 sm:p-6 max-w-4xl mx-auto flex flex-col">
                    <header className="text-center mb-6 pt-2">
                        <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900">¡Armemos la Historia!</h1>
                    </header>
                    <main className="disney-card p-5 sm:p-8 flex-1">
                        {wizardStep === 0 && (
                            <div className="max-w-md mx-auto text-center">
                                <h3 className="text-xl font-black mb-4">Paso 0: Clave Mágica</h3>
                                <input type="password" placeholder="API Key Gemini..." className="border-2 rounded-xl px-4 py-3 w-full mb-4 focus:ring-4 focus:ring-amber-200" value={apiKey} onChange={e => handleSaveKey(e.target.value)} />
                                <button onClick={() => setWizardStep(1)} disabled={!apiKey.trim()} className="w-full py-4 rounded-xl font-extrabold text-white bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300">Guardar</button>
                            </div>
                        )}
                        {wizardStep === 1 && (
                            <div className="max-w-xl mx-auto text-center">
                                <h3 className="text-xl font-black mb-4">Paso 1: Jugadores</h3>
                                <div className="space-y-3 mb-6">
                                    {players.map(p => (
                                        <div key={p.id} className="flex items-center bg-slate-50 rounded-2xl px-5 py-3 border-2 border-slate-100">
                                            <span className="mr-3">{p.isStar ? '⭐' : '👤'}</span>
                                            <input type="text" value={p.name} onChange={e => updatePlayerName(p.id, e.target.value)} className="bg-transparent font-bold flex-1 outline-none" />
                                            <button onClick={() => removePlayer(p.id)} className="text-slate-400 hover:text-rose-500 font-black px-2">✕</button>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-4 mb-6">
                                    <button onClick={() => addPlayer(true)} className="flex-1 border-2 border-amber-300 bg-amber-50 font-bold py-3 rounded-xl">⭐ Niño Estrella</button>
                                    <button onClick={() => addPlayer(false)} className="flex-1 border-2 border-sky-300 bg-sky-50 font-bold py-3 rounded-xl">👤 Amigo</button>
                                </div>
                                <button onClick={handlePlayersNext} disabled={players.length === 0} className="w-full py-4 bg-pink-500 text-white font-extrabold rounded-xl disabled:bg-slate-300">Siguiente</button>
                            </div>
                        )}
                        {wizardStep === 2 && (
                            <div className="text-center">
                                <h3 className="text-xl font-black mb-4">Paso 2: Personajes</h3>
                                <div className="flex justify-center gap-2 mb-6">
                                    {players.map(p => (
                                        <button key={p.id} onClick={() => setActivePlayerId(p.id)} className={`px-4 py-2 rounded-xl font-bold border ${activePlayerId === p.id ? 'text-white' : 'bg-white'}`} style={{ backgroundColor: activePlayerId === p.id ? p.color : undefined }}>
                                            {p.name}
                                        </button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-8">
                                    {CHARACTERS.map(c => {
                                        const owner = players.find(p => p.id === selectedCharacters.find(sc => sc.char.id === c.id)?.playerId);
                                        return (
                                            <div key={c.id} onClick={() => assignCharacter(c)} className={`p-3 rounded-2xl border-4 cursor-pointer text-center ${owner ? 'bg-white shadow-md' : 'bg-slate-50 border-transparent'}`} style={{ borderColor: owner?.color }}>
                                                <img src={c.image} className="h-16 mx-auto mb-2 object-contain" />
                                                <span className="text-xs font-black">{c.name}</span>
                                                {owner && <div className="text-[10px] text-white rounded mt-1 font-bold" style={{ backgroundColor: owner.color }}>{owner.name}</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-4"><button onClick={() => setWizardStep(1)} className="px-6 py-4 bg-slate-100 font-bold rounded-xl">Atrás</button><button onClick={() => setWizardStep(3)} disabled={selectedCharacters.length === 0} className="flex-1 bg-pink-500 text-white font-bold rounded-xl">Siguiente</button></div>
                            </div>
                        )}
                        {wizardStep === 3 && (
                            <div className="max-w-3xl mx-auto text-center">
                                <h3 className="text-xl font-black mb-6">Paso 3: Nivel</h3>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                                    {[{ id: 'facil', n: 'Fácil' }, { id: 'medio', n: 'Medio' }, { id: 'dificil', n: 'Difícil' }, { id: 'narrada', n: 'Narrada' }].map(l => (
                                        <div key={l.id} onClick={() => setDifficulty(l.id)} className={`p-4 rounded-xl border-2 cursor-pointer font-black ${difficulty === l.id ? 'border-pink-500 bg-pink-50 text-pink-600' : 'border-slate-200 text-slate-500'}`}>{l.n}</div>
                                    ))}
                                </div>
                                <div className="flex gap-4"><button onClick={() => setWizardStep(2)} className="px-6 py-4 bg-slate-100 font-bold rounded-xl">Atrás</button><button onClick={generateStory} className="flex-1 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black text-lg rounded-xl">✨ ¡Empezar!</button></div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
